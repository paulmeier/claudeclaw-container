name: Upstream sync

# Once a week, check whether moazbuilds/claudeclaw's master has advanced past
# the SHA recorded in .upstream-ref. If so, open a `feat:` bump PR and enable
# auto-merge (squash) on it, so it lands only once main's required checks
# (lint, security, smoke) pass against the new upstream SHA. Auto-merge is
# enabled by the RELEASE_BOT_TOKEN PAT (NOT the default GITHUB_TOKEN), so the
# resulting push to main triggers release-please, which in turn auto-merges its
# release PR and dispatches docker-publish.
# End-to-end: cron -> ~20-30 min later, image is on GHCR. A failing check
# leaves the PR open for a human instead of shipping.

on:
  schedule:
    - cron: '17 9 * * 1'  # Mondays 09:17 UTC
  workflow_dispatch:

permissions: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.RELEASE_BOT_TOKEN }}

      - name: Resolve upstream HEAD
        id: upstream
        run: |
          sha=$(git ls-remote https://github.com/moazbuilds/claudeclaw HEAD | awk '{print $1}')
          if [ -z "$sha" ]; then
            echo "Failed to resolve upstream HEAD" >&2
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "short=${sha:0:7}" >> "$GITHUB_OUTPUT"

      - name: Compare with .upstream-ref
        id: diff
        run: |
          current=$(tr -d '[:space:]' < .upstream-ref 2>/dev/null || echo "")
          new="${{ steps.upstream.outputs.sha }}"
          if [ "$current" = "$new" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No upstream changes (still at $current)."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "previous=$current" >> "$GITHUB_OUTPUT"
            echo "Upstream advanced: ${current:-<none>} -> $new"
          fi

      - name: Bump, push, and merge
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN }}
          NEW_SHA: ${{ steps.upstream.outputs.sha }}
          NEW_SHORT: ${{ steps.upstream.outputs.short }}
          PREV_SHA: ${{ steps.diff.outputs.previous }}
        run: |
          branch="chore/upstream-sync-${NEW_SHORT}"

          if gh pr list --head "$branch" --state open --json number --jq '.[0].number' | grep -q .; then
            echo "PR for $branch already open; nothing to do."
            exit 0
          fi

          # Commit under a stable bot identity; the push itself is authed by
          # the PAT (attributed to its owner in the repo's activity).
          git config user.name "claudeclaw-release-bot"
          git config user.email "claudeclaw-release-bot@users.noreply.github.com"

          git checkout -b "$branch"
          echo "$NEW_SHA" > .upstream-ref
          git add .upstream-ref
          git commit -m "feat: bump claudeclaw to ${NEW_SHORT}" \
                     -m "Upstream: https://github.com/moazbuilds/claudeclaw/commit/${NEW_SHA}"
          git push -u origin "$branch"

          if [ -n "$PREV_SHA" ]; then
            compare_line="**Compare:** https://github.com/moazbuilds/claudeclaw/compare/${PREV_SHA}...${NEW_SHA}"
          else
            compare_line="**Commit:** https://github.com/moazbuilds/claudeclaw/commit/${NEW_SHA}"
          fi

          gh pr create \
            --base main \
            --head "$branch" \
            --title "feat: bump claudeclaw to ${NEW_SHORT}" \
            --body "Automated weekly upstream sync.

          ${compare_line}

          Auto-merged by the release-bot once required checks pass, which triggers release-please."

          gh pr merge "$branch" --auto --squash --delete-branch
