name: Security scan

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 6 * * 1"  # Every Monday at 06:00 UTC
  workflow_dispatch:

jobs:
  trivy:
    name: Trivy vulnerability scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Scan the same upstream SHA that docker-publish ships, not whatever
      # master is at scan time.
      - name: Read pinned upstream SHA
        id: pin
        run: echo "ref=$(tr -d '[:space:]' < .upstream-ref)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ignore-error: concurrent push + pull_request runs race to write the
      # same GHA cache entries ("failed to reserve cache"); a cache-write miss
      # shouldn't fail the scan.
      - name: Build image for scanning
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: claudeclaw:scan
          build-args: |
            CLAUDECLAW_REF=${{ steps.pin.outputs.ref }}
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true
          provenance: false

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: claudeclaw:scan
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Upload results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif
